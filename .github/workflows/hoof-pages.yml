name: HOOF checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'clement-arcade/**'
      - '.github/workflows/hoof-pages.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Worker
        run: npm run build
        working-directory: clement-arcade
      - name: Test game and leaderboard
        run: npm test
        working-directory: clement-arcade

